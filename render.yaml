services:
  - type: web
    name: mavisio-api
    runtime: docker
    plan: standard
    region: frankfurt
    dockerContext: ./mavisio-backend
    dockerfilePath: ./mavisio-backend/Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mavisio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://ai-body-measurement-mocha.vercel.app"]'
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"

databases:
  - name: mavisio-db
    databaseName: mavisio
    user: mavisio
    plan: basic-256mb
    region: frankfurt
